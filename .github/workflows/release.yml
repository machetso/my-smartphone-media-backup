name: Build and release

# Runs the tests and builds the Linux and Windows programs.
#  - "Run workflow" button (Actions tab): test build only, programs downloadable as artifacts.
#  - Pushing a tag like v0.9.0: additionally creates a DRAFT release with the programs attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read          # only the release job below may write (it creates the release)

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Unit and end-to-end tests
        run: python -m unittest discover tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04          # older glibc = runs on more Linux distributions
            platform: linux-x86_64
            binary: my-smartphone-media-backup
          - os: windows-latest
            platform: windows-x64
            binary: My-Smartphone-Media-Backup
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          if [ "$RUNNER_OS" = "Windows" ]; then python -m pip install pywin32; fi

      - name: Check that the tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CODE=$(python -c "import phonebackup; print(phonebackup.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          echo "code version: $CODE   tag: $TAG"
          test "$CODE" = "$TAG"

      - name: Google Drive key (from the repository secrets, never in git)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            python tools/set_google_key.py --id "$GOOGLE_CLIENT_ID" --secret "$GOOGLE_CLIENT_SECRET"
          else
            echo "::warning::GOOGLE_CLIENT_ID secret missing - Google Drive export will be unavailable"
          fi

      - name: Build program
        run: |
          EXTRA="--hidden-import segno --hidden-import phonebackup._gkey --collect-submodules bleak"
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then
            SEP=";"
            EXTRA="$EXTRA --hidden-import win32com.client --hidden-import pythoncom"
          fi
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name "${{ matrix.binary }}" --exclude-module tkinter $EXTRA \
            --icon assets/icon.ico --add-data "assets/icon.png${SEP}assets" --add-data "assets/icon.ico${SEP}assets" --add-data "assets/companion/MediaBackup.apk${SEP}assets/companion" \
            smartphone_media_backup.py

      - name: Package
        run: |
          VERSION=$(python -c "import phonebackup; print(phonebackup.__version__)")
          NAME="my-smartphone-media-backup-v${VERSION}-${{ matrix.platform }}"
          mkdir -p "pkg/$NAME"
          cp dist/* README.md LICENSE "pkg/$NAME/"
          cd pkg
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$NAME.zip" "$NAME" > /dev/null
            # the program on its own as well (GitHub only shows ".zip" – user request 2026-11-06)
            cp "$NAME/${{ matrix.binary }}.exe" "${{ matrix.binary }}-v${VERSION}-${{ matrix.platform }}.exe"
          else
            chmod +x "$NAME/${{ matrix.binary }}"
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          rm -rf "$NAME"
          ls -la

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.platform }}
          path: pkg/*

  release:
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: pkg
          merge-multiple: true
      - name: Checksums
        run: |
          cd pkg
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?v?" v "\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pkg/* \
            --draft \
            --title "My Smartphone Media Backup $GITHUB_REF_NAME" \
            --notes-file notes.md
